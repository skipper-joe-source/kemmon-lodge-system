[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kemmon-lodge-backend"
version = "0.1.0"
description = "Kemmon Lodge Management System backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "alembic",
    "pydantic-settings",
    "argon2-cffi",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
